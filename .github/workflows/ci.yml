name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the legacy parity oracle reads files from the pinned commit
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --group dev
      - run: uv run pytest -p no:pytestqt tests/core tests/rules tests/services tests/plugins tests/test_layering.py tests/test_purity.py
      - run: uv run pytest --junitxml=junit.xml
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: junit.xml

  build:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --group build
      - shell: pwsh
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dd-manager-portable
          path: "release/DD Manager Portable *.zip"
