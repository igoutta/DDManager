name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv with Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: uv sync --group build

      - name: Build portable package
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Create SHA256 file
        shell: pwsh
        run: |
          $zip = Get-ChildItem "release/*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Could not find a release zip in the release folder."
          }
          $hash = Get-FileHash $zip.FullName -Algorithm SHA256
          "$($hash.Hash) *$($zip.Name)" | Set-Content ($zip.FullName -replace '\.zip$', '.sha256')

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.sha256
